name: Build PocketBridge APK

"on":
  workflow_dispatch:
  push:
    paths:
      - "android-client/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: pocketbridge-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PB_KEYSTORE_BASE64: ${{ secrets.PB_KEYSTORE_BASE64 }}
      PB_KEYSTORE_PASSWORD: ${{ secrets.PB_KEYSTORE_PASSWORD }}
      PB_KEY_ALIAS: ${{ secrets.PB_KEY_ALIAS }}
      PB_KEY_PASSWORD: ${{ secrets.PB_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # AGP 4.2.2 + Gradle 6.7.1 run on Java 11. Pin an SDK
          # command-line tools release that is also compatible with Java 11.
          cmdline-tools-version: "8512546"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools platforms;android-30 build-tools;30.0.3

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-30"
          test -d "$ANDROID_SDK_ROOT/build-tools/30.0.3"

      - name: Set up Gradle 6.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "6.7.1"

      - name: Prepare optional release signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PB_KEYSTORE_BASE64" ] && [ -n "$PB_KEYSTORE_PASSWORD" ] && [ -n "$PB_KEY_ALIAS" ] && [ -n "$PB_KEY_PASSWORD" ]; then
            printf '%s' "$PB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocketbridge-release.jks"
            echo "PB_KEYSTORE_PATH=$RUNNER_TEMP/pocketbridge-release.jks" >> "$GITHUB_ENV"
            echo "PB_RELEASE_SIGNING_READY=1" >> "$GITHUB_ENV"
          else
            echo "PB_RELEASE_SIGNING_READY=0" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK and run lint
        working-directory: android-client
        run: gradle --no-daemon clean lintDebug assembleDebug

      - name: Build signed release APK
        if: env.PB_RELEASE_SIGNING_READY == '1'
        working-directory: android-client
        run: gradle --no-daemon assembleRelease

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android-client/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/PocketBridge-Remote-MultiDevice-v1.9.0-debug.apk
          if [ -f android-client/app/build/outputs/apk/release/app-release.apk ]; then
            cp android-client/app/build/outputs/apk/release/app-release.apk \
               artifacts/PocketBridge-Remote-MultiDevice-v1.9.0-release.apk
          fi
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PocketBridge-Remote-MultiDevice-v1.9.0
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
