apply plugin: 'com.android.application'

def hasReleaseSigning = [
        System.getenv("PB_KEYSTORE_PATH"),
        System.getenv("PB_KEYSTORE_PASSWORD"),
        System.getenv("PB_KEY_ALIAS"),
        System.getenv("PB_KEY_PASSWORD")
].every { it != null && it.trim().length() > 0 }

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "ua.pocketbridge.lgp500"
        minSdkVersion 10
        targetSdkVersion 28
        versionCode 15
        versionName "1.7.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(System.getenv("PB_KEYSTORE_PATH"))
                storePassword System.getenv("PB_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PB_KEY_ALIAS")
                keyPassword System.getenv("PB_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    lintOptions {
        abortOnError true
        checkReleaseBuilds true
        disable 'ExpiredTargetSdkVersion'
    }
}
